name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run that is still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - run: npm run lint

  jest:
    name: jest
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      # Vitest, driven with the Jest API: describe / it / expect.
      - run: npm test

  e2e:
    name: e2e
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      # Boots the dev server, waits for the port, runs Cypress headlessly.
      - run: npm run e2e

  build:
    name: build
    needs: [lint, jest, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Build
        # A user site (<owner>.github.io) is served from the root, a project
        # page from /<repo>/ — the asset base has to match either way.
        env:
          VITE_BASE: >-
            ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner)
            && '/'
            || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  push:
    name: push
    needs: build
    # Only the default branch is published; feature branches stop after build.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
